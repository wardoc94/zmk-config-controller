CONFIG_SPI=y
CONFIG_INPUT=y
CONFIG_ZMK_POINTING=y
CONFIG_PAW3395=y
CONFIG_PAW3395_REPORT_INTERVAL_MIN=8
CONFIG_PAW3395_LOG_LEVEL_DBG=y

# TEMPORARY - for diagnosing the non-responsive sensor. This shield isn't a
# split peripheral, so USB logging actually works here (unlike swiftpaw_right).
# Remove once diagnosed - USB logging adds power draw and isn't something to
# leave on permanently.
CONFIG_ZMK_USB_LOGGING=y
