CONFIG_SPI=y
CONFIG_INPUT=y
CONFIG_ZMK_POINTING=y
CONFIG_PAW3395=y

# EXPERIMENTAL: same sub-7.5ms interval settings as the split build
# (zmkfirmware/zmk#3381), added for consistency. NOTE: this shield talks
# directly to a real host (PC/phone), not another ZMK/Zephyr device - the
# issue is explicit that sub-7.5ms intervals only work device-to-device
# between two Zephyr/ZMK peers, never with a real host. Any real host will
# renegotiate back to a spec-compliant interval regardless of this request,
# so expect this to be a no-op here rather than an actual speedup.
CONFIG_BT_CTLR_ADVANCED_FEATURES=y
CONFIG_BT_CTLR_CONN_INTERVAL_LOW_LATENCY=y
CONFIG_BT_CONN_PARAM_ANY=y
CONFIG_BT_CTLR_ASSERT_OVERHEAD_START=n
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=1
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=1
CONFIG_BT_PERIPHERAL_PREF_LATENCY=100
CONFIG_BT_GAP_AUTO_UPDATE_CONN_PARAMS=y
CONFIG_BT_CONN_PARAM_UPDATE_TIMEOUT=1000
