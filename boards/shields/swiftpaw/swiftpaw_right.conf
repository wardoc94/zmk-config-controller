# Pointing device stack
CONFIG_SPI=y
CONFIG_INPUT=y
CONFIG_ZMK_POINTING=y

# PAW3395 driver - option name inferred from badjeff's other sensor drivers
# (CONFIG_PMW3610_ALT, CONFIG_ADNS9800). Check the driver's Kconfig file for
# the real symbol name and tune to taste. Likely candidates:
CONFIG_PAW3395=y
# CONFIG_PAW3395_REPORT_INTERVAL_MIN=8
CONFIG_PAW3395_LOG_LEVEL_DBG=y

# NOTE: CONFIG_ZMK_USB_LOGGING doesn't work here - this shield is the split
# PERIPHERAL, and peripherals can never do USB output at all (same rule as
# "only central sends HID over USB"). If you need to see boot logs from this
# specific board, that requires RTT (SEGGER J-Link/debug probe) instead of
# USB logging, since there's no USB HID/serial link to a host from a
# peripheral by design.
