# Pointing device stack
CONFIG_SPI=y
CONFIG_INPUT=y
CONFIG_ZMK_POINTING=y

# PAW3395 driver - confirmed working (verified via debug logs: product ID
# check, CPI set, axis control, and "PAW3395 initialized" all succeed)
CONFIG_PAW3395=y

# Throttle the sensor's own report rate (minimum ms between reports) to
# reduce event volume flowing through the whole relay chain (SPI -> split
# relay -> BLE -> central -> HID). This is a mitigation attempt for the
# full keyboard lockup after sustained trackball use, not a confirmed fix -
# I couldn't find a documented root cause for that lockup, but fewer events
# per second directly relieves pressure on whatever's getting overwhelmed,
# regardless of the exact mechanism. If this doesn't help, next step would
# be capturing a log that spans the actual freeze moment.
CONFIG_PAW3395_REPORT_INTERVAL_MIN=8

# Request the fastest BLE interval the spec allows (7.5ms - value 6, in
# 1.25ms steps) specifically for this half's link to the central. This
# board is always the BT-peripheral role in that specific link (regardless
# of ZMK's own "split peripheral" terminology), so this setting targets the
# right link. Unlike the earlier CONFIG_BT_CTLR_CONN_INTERVAL_LOW_LATENCY
# experiment (which pushed below spec minimum and caused instability), this
# is fully spec-compliant - a much smaller, safer speedup, but shouldn't
# carry the same crash/pairing risk.
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=6
CONFIG_BT_GAP_AUTO_UPDATE_CONN_PARAMS=y
CONFIG_BT_CONN_PARAM_UPDATE_TIMEOUT=1000
