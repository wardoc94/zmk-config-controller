# Pointing device stack
CONFIG_SPI=y
CONFIG_INPUT=y
CONFIG_ZMK_POINTING=y

# PAW3395 driver - confirmed working (verified via debug logs: product ID
# check, CPI set, axis control, and "PAW3395 initialized" all succeed)
CONFIG_PAW3395=y
CONFIG_PAW3395_LOG_LEVEL_DBG=y

# Throttle the sensor's own report rate (minimum ms between reports). This
# was added as a mitigation attempt for a full keyboard lockup after
# sustained trackball use, back when this sensor's data had to relay
# peripheral -> central over BLE. Now that right is central and talks to
# the sensor directly (no relay), this may no longer be necessary - worth
# testing removal once you've confirmed the freeze doesn't recur, if you
# want maximum responsiveness back.
CONFIG_PAW3395_REPORT_INTERVAL_MIN=8

# Request the fastest BLE interval the spec allows (7.5ms - value 6, in
# 1.25ms steps) for this board's connection to the host. Right is central
# now, so this affects the host-facing link, not a split link. Unlike the
# earlier CONFIG_BT_CTLR_CONN_INTERVAL_LOW_LATENCY experiment (which pushed
# below spec minimum and caused instability), this is fully spec-compliant.
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=6
CONFIG_BT_GAP_AUTO_UPDATE_CONN_PARAMS=y
CONFIG_BT_CONN_PARAM_UPDATE_TIMEOUT=1000
