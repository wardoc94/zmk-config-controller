# Pointing device stack
CONFIG_SPI=y
CONFIG_INPUT=y
CONFIG_ZMK_POINTING=y

# PAW3395 driver - option name inferred from badjeff's other sensor drivers
# (CONFIG_PMW3610_ALT, CONFIG_ADNS9800). Check the driver's Kconfig file for
# the real symbol name and tune to taste. Likely candidates:
CONFIG_PAW3395=y
# CONFIG_PAW3395_REPORT_INTERVAL_MIN=8
# CONFIG_PAW3395_LOG_LEVEL_DBG=y

# EXPERIMENTAL: sub-7.5ms BLE split connection interval (see swiftpaw_left.conf
# for the caveats - same open issue, zmkfirmware/zmk#3381). This side sets the
# actual requested interval: 1 = 1ms (500us + 1*500us step). If you add a
# second peripheral later, bump MIN/MAX_INT to 3 (2ms) per the issue's
# recommendation to leave more radio time for multiple simultaneous links.
CONFIG_BT_CTLR_ADVANCED_FEATURES=y
CONFIG_BT_CTLR_CONN_INTERVAL_LOW_LATENCY=y
CONFIG_BT_CONN_PARAM_ANY=y
CONFIG_BT_CTLR_ASSERT_OVERHEAD_START=n
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=1
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=1
CONFIG_BT_PERIPHERAL_PREF_LATENCY=100
CONFIG_BT_GAP_AUTO_UPDATE_CONN_PARAMS=y
CONFIG_BT_CONN_PARAM_UPDATE_TIMEOUT=1000
