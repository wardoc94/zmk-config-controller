CONFIG_ADC=y

# Request the fastest BLE connection interval the spec actually allows
# (7.5ms - value 6, in 1.25ms steps) for the connection to the host, and ask
# to renegotiate promptly after connecting. Unlike the split central<->
# peripheral hack we tried and reverted, this is fully spec-compliant and
# works with any real host - just a much more modest speedup.
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=6
CONFIG_BT_GAP_AUTO_UPDATE_CONN_PARAMS=y
CONFIG_BT_CONN_PARAM_UPDATE_TIMEOUT=1000
