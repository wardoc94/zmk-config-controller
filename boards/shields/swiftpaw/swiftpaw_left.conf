CONFIG_ADC=y

# EXPERIMENTAL: sub-7.5ms BLE split connection interval (from an open,
# unmerged ZMK GitHub issue, not an official supported feature: zmkfirmware/
# zmk#3381). Speeds up peripheral->central reporting - relevant here since
# the PAW3395 sensor lives on the right (peripheral) half.
#
# Real caveats, not hypothetical:
# - Not Bluetooth-spec-compliant; only works between two Zephyr/ZMK devices,
#   never with a host directly.
# - Meaningfully increases central-side power draw (this half wakes up far
#   more often). The issue's author specifically calls this out as intended
#   for USB-powered dongle setups, not battery-powered split halves like
#   this one - expect noticeably worse battery life on this half.
# - The issue's own author reports crashes during testing on both sides.
# - Real-world throughput tops out around 600-700Hz in practice, not the
#   full 1000Hz the 1ms interval implies.
CONFIG_BT_CTLR_ADVANCED_FEATURES=y
CONFIG_BT_CTLR_CONN_INTERVAL_LOW_LATENCY=y
CONFIG_BT_CONN_PARAM_ANY=y
CONFIG_BT_CTLR_ASSERT_OVERHEAD_START=n
